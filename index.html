<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="/" method="post">
        <fieldset>
            <legend><strong>Dados pessoais</strong></legend>
            <div>
                <label for="nome-usuario">Digite seu nome completo:</label>
                <input type="text" id="nome-usuario" placeholder="Ex: Fulano de Tal" required>
            </div>
            <div>
                <label for="data-de-nascimento">Digite sua data de nascimento:</label>
                <input type="date" id="data-de-nascimento"  required>
            </div>
            <div>
                <label for="cpf">Digite seu CPF:</label>
                <input type="text" id="cpf" placeholder="Ex: 111.666.999-11" required>
            </div>
            <label for="sexo">Selecione seu sexo:</label>
            <div>
                <input type="radio" id="masculino" name="sexo">
                <label for="masculino">Masculino</label>
            </div>
            <div>
                <input type="radio" name="sexo" id="feminino">
                <label for="feminino" >Feminino</label>
            </div>
            <div>
                <input type="radio" name="sexo" id="outro">
                <label for="outro">Outro</label>
            </div>
            <div>
                <input type="radio" name="sexo" id="prefiro-nao-informar">
                <label for="prefiro-nao-informar">Prefiro não informar</label>
            </div>
            <div>
                <label for="email">Digite seu email:</label>
                <input type="email" id="email" placeholder="Ex: abcd@gmail.com" required>
            </div>
            <div>
                <label for="telefone">Digite seu telefone</label>
                <input type="tel" id="telefone" placeholder="Ex: (00) 00000-0000" required>
            </div>
        </fieldset>
        <fieldset>
            <Legend>Endereço</Legend>
            <div>
                <label for="cep">CEP</label>
                <input type="number" id="cep" placeholder="Ex: 00000000" required>
            </div>
            <div>
                <label for="estado">Estado:</label>
                <select id="estado" name="estado" required>
                    <option value="" selected disabled>Selecione seu estado</option>
                    <option value="Acre (AC)">Acre (AC)</option>
                    <option value="Alagoas (AL)">Alagoas (AL)</option>
                    <option value="Amapá (AP)">Amapá (AP)</option>
                    <option value="Amazonas (AM)">Amazonas (AM)</option>
                    <option value="Bahia (BA)">Bahia (BA)</option>
                    <option value="Ceará (CE)">Ceará (CE)</option>
                    <option value="Distrito Federal (DF)">Distrito Federal (DF)</option>
                    <option value="Espírito Santo (ES)">Espírito Santo (ES)</option>
                    <option value="Goiás (GO)">Goiás (GO)</option>
                    <option value="Maranhão (MA)">Maranhão (MA)</option>
                    <option value="Mato Grosso (MT)">Mato Grosso (MT)</option>
                    <option value="Mato Grosso do Sul (MS)">Mato Grosso do Sul (MS)</option>
                    <option value="Minas Gerais (MG)">Minas Gerais (MG)</option>
                    <option value="Pará (PA)">Pará (PA)</option>
                    <option value="Paraíba (PB)">Paraíba (PB)</option>
                    <option value="Paraná (PR)">Paraná (PR)</option>
                    <option value="Pernambuco (PE)">Pernambuco (PE)</option>
                    <option value="Piauí (PI)">Piauí (PI)</option>
                    <option value="Rio de Janeiro (RJ)">Rio de Janeiro (RJ)</option>
                    <option value="Rio Grande do Norte (RN)">Rio Grande do Norte (RN)</option>
                    <option value="Rio Grande do Sul (RS)">Rio Grande do Sul (RS)</option>
                    <option value="Rondônia (RO)">Rondônia (RO)</option>
                    <option value="Roraima (RR)">Roraima (RR)</option>
                    <option value="Santa Catarina (SC)">Santa Catarina (SC)</option>
                    <option value="São Paulo (SP)">São Paulo (SP)</option>
                    <option value="Sergipe (SE)">Sergipe (SE)</option>
                    <option value="Tocantins (TO)">Tocantins (TO)</option>
                </select>
            </div>
            <div>
                <label for="cidade">Digite sua cidade:</label>
                <input type="text" id="cidade" placeholder="Ex: Califórnia" required>
            </div>
            <div>
                <label for="bairro">Digite seu bairro:</label>
                <input type="text" id="bairro" placeholder="Ex: Centro" required>
            </div>
            <div>
                <label for="rua">Digite sua rua:</label>
                <input type="text" id="rua" placeholder="Ex: 1° de Maio" required>
            </div>
            <div>
                <label for="numero-da-casa">Digite seu número da casa:</label>
                <input type="text" id="numero-da-casa" placeholder="Ex: 123" required>
            </div>
            <div>
                <label for="complemento">Digite seu complemento</label>
                <input type="text" id="complemento" placeholder="Ex: Apto 123">
            </div>
        </fieldset>
        <fieldset>
            <legend>Informações sobre o plano:</legend>
            <div>
                <label for="plano">Plano</label>
                <select id="plano" name="plano">
                    <option value="Selecione seu plano:" selected disabled>Selecione seu plano</option>
                    <option value="mensal">Mensal</option>
                    <option value="trimestral">Trimestral</option>
                    <option value="semestral">Semestral</option>
                    <option value="anual">Anual</option>
                </select>
            </div>
            <div>
                <label for="turno">Turno</label>
                <select name="turno" id="turno">
                    <option value="Selecione seu turno" selected disabled>Selecione seu turno</option>
                    <option value="manha">Manhã</option>
                    <option value="tarde">Tarde</option>
                    <option value="noite">Noite</option>
                </select>
            </div>
            <div>
                <label for="Objetivo:">Objetivo:</label>
                <select name="Objetivo" id="Objetivo">
                    <option value="Selecione-seu-objetivo" selected disabled>Selecione seu objetivo</option>
                    <option value="ganho-de-massa">Ganho de massa</option>
                    <option value="emagrecimento">Emagrecimento</option>
                    <option value="Condicionamento-Fisico">Condicionamento Físico</option>
                    <option value="Saude-e-qualidade-de-vida">Saúde e qualidade de vida</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>
        </fieldset>
        <fieldset>
            <legend>Modalidades de interesse</legend>
            <label for="Selecione as modalidades que são do seu interesse:"></label>
            <div>
                <input type="checkbox" id="Musculacao">
                <label for="Musculacao">Musculação</label>
            </div>
                <input type="checkbox" id="funcional">
                <label for="funcional">Funcional</label>
            <div>
            </div>
                <input type="checkbox" id="Natacao">
                <label for="Natacao">Natação</label>
            <div>
            </div>
                <input type="checkbox" id="Pilates">
                <label for="Pilates">Pilates</label>
            </div>
            <div>
                <input type="checkbox" id="artes-marciais">
                <label for="artes-marciais">Artes Marciais</label>
            </div>
            <div>
                <input type="checkbox" id="Spinning">
                <label for="Spinning">Spinning</label>
            </div>
        </fieldset>
        <fieldset>
            <legend>Informações complementares</legend>
            <div>
                <label for="Adicionais">Informações Adicionais:</label>
                <br>
                <textarea id="Adicionais" style="width: 600px; height: 150px;" placeholder="Ex: Faço calistenia e balé."></textarea>
            </div>
            <div>
                <label for="atividades-fisicas">Você já praticou físicas?</label>
            </div>
            <div>
                <input type="radio" name="opcao" id="sim">
                <label for="sim">Sim</label>
            </div>
            <div>
                <input type="radio" name="opcao" id="Nao">
                <label for="Nao">Não</label>
            </div>
            <div>
                <label for="atividades-realizadas">Se sim, quais atividades físicas você realizou?</label>
                <br>
                <textarea id="atividades-realizadas" style="width: 600px; height: 150px;" placeholder="Ex: Fiz Judô há dois anos por 6 meses."></textarea>
            </div>
        </fieldset>
        <fieldset>
            <legend>Documentação</legend>
            <div>
                <label for="documento">Envie um documento de identificação com foto:<label> 
                    <br>
                <input type="file" id="documento" required>                                                       
            </div>
        </fieldset>
        <fieldset>
            <legend>Política de uso de dados:</legend>
            <p>
                Os dados fornecidos serão utilizados pela academia para fins de cadastro e contato.
            </p>
            <input type="radio"required id="autiricacao">
            <label for="autoricacao">Li e concordo com os termos de uso e autorizo o tratamento dos dados fornecidos para realização do cadastro.</label>
        </fieldset>
        <input type="reset" value="Limpar">
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
